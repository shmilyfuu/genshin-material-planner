<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>原神养成规划</title><link rel="stylesheet" href="desktop.css">
</head>
<body>
<div class="app">
  <header class="app-header">
    <div class="app-identity"><span class="app-mark">◆</span><div><strong>原神养成规划</strong><span id="appVersion"></span></div></div>
    <div class="account-picker"><select id="accountSelect" aria-label="切换规划账号"></select></div>
    <div class="account-binding" id="accountBinding"><strong id="boundNickname"></strong><span id="boundUid">未绑定米游社</span></div>
    <div class="header-spacer"></div>
    <button class="soft-btn header-icon-btn" id="syncInventoryButton" type="button"><span class="header-icon inventory-icon" aria-hidden="true"></span>同步库存</button>
    <div class="settings-wrap" id="settingsWrap">
      <button class="soft-btn header-icon-btn" id="settingsButton" type="button" aria-expanded="false" aria-controls="settingsMenu"><span class="header-icon settings-icon" aria-hidden="true"></span>设置</button>
      <div id="settingsMenu" class="settings-menu" hidden>
        <div class="settings-group"><span>账号管理</span>
          <button id="addAccountButton" type="button">添加规划账号</button>
          <button id="renameAccountButton" type="button">重命名当前账号</button>
          <button id="deleteAccountButton" type="button">删除当前账号</button>
          <button id="mysOpen" type="button">米游社账号与绑定</button>
        </div>
        <div class="settings-group"><span>资料与数据</span>
          <button id="refreshButton" type="button">刷新游戏资料</button>
          <button id="importGoodButton" type="button">导入 GGScanner</button>
          <button id="importButton" type="button">导入规划</button>
          <button id="exportButton" type="button">导出规划</button>
        </div>
        <div class="settings-group"><span>程序</span><button id="checkUpdateButton" type="button">检查更新</button></div>
      </div>
    </div>
  </header>
  <section class="calendar-strip" aria-label="每周刷取日历">
    <div class="strip-heading" id="calendarHeading" title="按当前培养目标显示秘境材料"><strong>刷取日历</strong></div>
    <div class="calendar-days" id="calendarDays" tabindex="0" aria-label="每周材料开放日"></div>
  </section>
  <section class="active-goals-strip" aria-label="正在培养">
    <div class="strip-heading" id="activeGoalsHeading"><strong>正在培养</strong></div>
    <div class="active-goal-list" id="activeGoals" tabindex="0" aria-label="正在培养的角色与武器"></div>
  </section>
  <div class="workbench" id="workbench">
    <main class="editor">
      <section class="chooser-panel">
        <div class="tabs" role="tablist" aria-label="培养对象">
          <button type="button" class="tab active" role="tab" data-tab="character" aria-selected="true" aria-label="角色" title="角色"><span class="tab-icon character-tab-icon" aria-hidden="true"></span></button>
          <button type="button" class="tab" role="tab" data-tab="weapon" aria-selected="false" aria-label="武器" title="武器"><span class="tab-icon weapon-tab-icon" aria-hidden="true"></span></button>
          <span class="roster-help">单击选择或取消 · 提升按钮编辑</span>
        </div>
        <div class="filter-area">
          <div class="filter-top">
            <label class="searchbox"><span class="search-icon" aria-hidden="true"></span><input id="searchInput" type="search" placeholder="搜索名称" aria-label="搜索名称" autocomplete="off"></label>
            <div class="filter-row" id="starFilters" aria-label="星级筛选"></div>
          </div>
          <div class="filter-row" id="elementFilters" aria-label="元素筛选"></div>
          <div class="filter-row" id="weaponFilters" aria-label="武器类型筛选"></div>
        </div>
        <div class="roster-scroll"><div class="roster-grid" id="rosterGrid" aria-live="polite"></div></div>
        <div class="roster-foot"><span id="rosterCount">—</span><span>培养中 → 已有角色／武器 → 新到旧</span></div>
      </section>
    </main>
    <div class="column-resizer" data-divider="0" role="separator" tabindex="0" aria-orientation="vertical" aria-label="调整角色与背包列宽"></div>
    <aside class="inventory-rail">
      <div class="inventory-heading"><strong>背包材料</strong><span id="inventoryTarget">选择培养目标</span></div>
      <div class="inventory-mode-switch" role="group" aria-label="库存模式"><button type="button" data-inventory-mode="manual" class="active" aria-pressed="true">手动背包</button><button type="button" data-inventory-mode="synced" aria-pressed="false">同步背包</button></div>
      <button class="inventory-apply" id="applyInventoryButton" type="button" hidden>应用到手动背包</button>
      <p class="inventory-note" id="inventoryModeNote">手动库存 · 输入框左侧可增加或减少 1。</p>
      <div class="inventory-scroll" id="inventoryGroups"></div>
    </aside>
    <div class="column-resizer" data-divider="1" role="separator" tabindex="0" aria-orientation="vertical" aria-label="调整背包与材料缺口列宽"></div>
    <aside class="deficit-rail">
      <div class="deficit-heading"><strong id="resultTitle">全部培养目标 · 材料缺口</strong><span id="resultSummary">共用背包统一扣除</span></div>
      <div class="deficit-content" id="resultContent" aria-live="polite"></div>
    </aside>
  </div>
  <footer class="status-bar" aria-label="程序状态"><span class="status-indicator" id="statusIndicator" aria-hidden="true"></span><span class="data-status" id="dataStatus" role="status" aria-live="polite">正在读取本地数据…</span><span class="status-secondary" id="statusNotice" role="status" aria-live="polite"></span></footer>
</div>
<div class="modal-backdrop" id="modal" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <h2 id="modalTitle">确认</h2><p id="modalDescription"></p>
    <input id="modalInput" type="text" maxlength="32" autocomplete="off">
    <div class="modal-actions"><button id="modalCancel" type="button">取消</button><button id="modalConfirm" class="primary-btn" type="button">确认</button></div>
  </div>
</div>
<div class="modal-backdrop" id="goalModal" hidden>
  <div class="modal goal-modal" role="dialog" aria-modal="true" aria-labelledby="goalModalTitle">
    <h2 id="goalModalTitle">培养目标</h2><div id="goalModalBody"></div>
    <div class="modal-actions"><button id="goalAddCopy" type="button" hidden>添加同名武器</button><button id="goalRemoveCopy" class="danger-btn" type="button" hidden>移除武器</button><button id="goalDelete" class="danger-btn" type="button">删除目标</button><span class="modal-spacer"></span><button id="goalCancel" type="button">取消</button><button id="goalSave" class="primary-btn" type="button">保存</button></div>
  </div>
</div>
<div class="modal-backdrop" id="mysModal" hidden>
  <div class="modal mys-modal" role="dialog" aria-modal="true" aria-labelledby="mysTitle">
    <h2 id="mysTitle">米游社账号与绑定</h2><p id="mysCurrentBinding"></p>
    <div class="goal-field"><span>米游社账号</span><select id="mysAccount"></select></div>
    <div class="modal-actions"><button id="mysAdd" type="button">添加账号</button><button id="mysRefresh" type="button">刷新凭证</button><button id="mysRemove" type="button">移除账号</button></div>
    <div id="mysQr" hidden><img id="mysQrImage" width="220" height="220" alt="米游社登录二维码"></div>
    <div class="goal-field"><span>原神 UID</span><select id="mysUid"></select></div>
    <div class="goal-field"><span>绑定规划账号</span><select id="mysBindingTarget"></select></div>
    <label class="goal-field" id="mysNewNameField" hidden><span>账号名称</span><input id="mysNewName" type="text" maxlength="32" autocomplete="off"></label>
    <div class="modal-actions"><button id="mysUnbind" type="button">解除当前绑定</button><button id="mysDiagnose" type="button">材料诊断</button><button id="mysBind" class="primary-btn" type="button">确认绑定</button></div>
    <p id="mysStatus" role="status"></p><p>库存按材料系列反推，虚线表示可确认的原始库存下限。未确定的材料留空；同步成功后更新整个同步背包。</p>
    <div class="modal-actions"><button id="mysClose" type="button">关闭</button></div>
  </div>
</div>
<div class="modal-backdrop" id="updateModal" hidden>
  <div class="modal update-modal" role="dialog" aria-modal="true" aria-labelledby="updateTitle">
    <h2 id="updateTitle">发现新版本</h2><p id="updateVersions"></p>
    <div id="updateNotes" class="update-notes"></div>
    <div class="update-progress" id="updateProgress" hidden><div class="update-progress-label"><span id="updatePhase"></span><span id="updatePercent"></span></div><progress id="updateBar" max="100" aria-label="更新进度"></progress><div class="update-progress-label"><span id="updateBytes"></span><span id="updateSpeed"></span></div></div>
    <p id="updateStatus" role="status">更新完成后程序将自动重启，本地规划与账号数据将保留。</p>
    <div class="modal-actions"><button id="updateLater" type="button">稍后更新</button><button id="updateInstall" class="primary-btn" type="button">立即更新</button></div>
  </div>
</div>
<div id="waitOverlay" class="wait-overlay" hidden>
  <div id="waitToast" class="wait-toast" role="status" aria-live="polite" aria-atomic="true" hidden>
    <span class="wait-spinner" aria-hidden="true"><span style="--dot:0"></span><span style="--dot:1"></span><span style="--dot:2"></span><span style="--dot:3"></span><span style="--dot:4"></span><span style="--dot:5"></span><span style="--dot:6"></span><span style="--dot:7"></span></span>
    <span id="waitMessage"></span>
  </div>
</div>
<script src="vendor/qrcode-generator.js"></script>
<script type="module" src="desktop-app.mjs"></script>
</body>
</html>
