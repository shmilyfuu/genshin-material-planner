name: Bootstrap GPL license and first release

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/bootstrap-gpl-release.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bootstrap-gpl-release
  cancel-in-progress: false

jobs:
  bootstrap:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install the complete GPL-3.0-only license text
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            'https://raw.githubusercontent.com/spdx/license-list-data/main/text/GPL-3.0-only.txt' \
            --output LICENSE

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add LICENSE

          if ! git diff --cached --quiet; then
            git commit -m 'Add complete GPL-3.0-only license text'
            git push origin HEAD:main
          fi

      - name: Resolve version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(jq -r '.version' manifest.json)"
          TAG="v${VERSION}"
          PACKAGE="genshin-material-planner-v${VERSION}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "package=${PACKAGE}" >> "$GITHUB_OUTPUT"

      - name: Create initial tag
        shell: bash
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          git fetch --tags --force
          if ! git rev-parse "refs/tags/${TAG}" >/dev/null 2>&1; then
            git tag -a "${TAG}" -m "Release ${TAG}"
            git push origin "${TAG}"
          fi

      - name: Build extension archive
        shell: bash
        env:
          PACKAGE: ${{ steps.version.outputs.package }}
        run: |
          set -euo pipefail
          ROOT="dist/${PACKAGE}"
          mkdir -p "${ROOT}/icons"

          cp manifest.json background.js sidepanel.html app.js core.mjs hakushin.mjs styles.css LICENSE README.md README_EN.md "${ROOT}/"
          cp icons/icon16.png icons/icon32.png icons/icon48.png icons/icon128.png "${ROOT}/icons/"

          (
            cd dist
            zip -r "${PACKAGE}.zip" "${PACKAGE}"
            sha256sum "${PACKAGE}.zip" > "${PACKAGE}.zip.sha256"
          )

      - name: Publish initial GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          PACKAGE: ${{ steps.version.outputs.package }}
        run: |
          set -euo pipefail
          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release upload "${TAG}" \
              "dist/${PACKAGE}.zip" \
              "dist/${PACKAGE}.zip.sha256" \
              --clobber
          else
            gh release create "${TAG}" \
              "dist/${PACKAGE}.zip" \
              "dist/${PACKAGE}.zip.sha256" \
              --verify-tag \
              --title "全能养成规划面板 v${VERSION}" \
              --generate-notes \
              --latest
          fi
