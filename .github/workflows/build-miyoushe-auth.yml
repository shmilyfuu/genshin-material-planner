name: Build Miyoushe calculator

on:
  push:
    branches:
      - miyoushe-inventory
    paths:
      - 'manifest.json'
      - 'sidepanel.html'
      - 'service-worker.js'
      - 'miyoushe-*.js'
      - 'app.js'
      - 'core.mjs'
      - 'tests/hakushin-weapon.test.mjs'
      - 'tests/miyoushe-calculator.test.mjs'
      - 'tests/miyoushe-hybrid.test.mjs'
      - 'tests/miyoushe-probe.test.mjs'
      - 'tests/hybrid-calculator.test.mjs'
      - 'hybrid-calculator.mjs'
      - 'multi-planner.mjs'
      - 'planner-accounts.mjs'
      - 'tests/planner-accounts.test.mjs'
      - 'tests/planner-materials.test.mjs'
      - 'tests/multi-planner.test.mjs'
      - 'tests/multi-plan-state.test.mjs'
      - 'hakushin.mjs'
      - 'miyoushe-*.css'
      - 'styles.css'
      - 'vendor/**'
      - '.github/workflows/build-miyoushe-auth.yml'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate extension
        run: |
          set -euo pipefail
          python -m json.tool manifest.json >/dev/null
          node --check background.js
          node --check app.js
          node --check stepper.js
          node --check service-worker.js
          node --check miyoushe-md5.js
          node --check miyoushe-auth-network.js
          node --check miyoushe-auth-state.js
          node --check miyoushe-auth-ui.js
          node --check miyoushe-calculator.js
          node --check core.mjs
          node --check hybrid-calculator.mjs
          node --check multi-planner.mjs
          node --check planner-accounts.mjs
          node --test tests/hakushin-weapon.test.mjs tests/miyoushe-calculator.test.mjs tests/miyoushe-hybrid.test.mjs tests/hybrid-calculator.test.mjs tests/miyoushe-probe.test.mjs tests/multi-planner.test.mjs tests/multi-plan-state.test.mjs tests/planner-accounts.test.mjs tests/planner-materials.test.mjs
          node - <<'NODE'
          const fs = require('fs');
          const network = fs.readFileSync('miyoushe-auth-network.js', 'utf8');
          const material = fs.readFileSync('miyoushe-calculator.js', 'utf8');
          if (!material.includes('MYS_CALC_CONTEXT')) throw Error('Calculator context is missing');
          if (!network.includes("header: 'Origin'") || !network.includes("header: 'Referer'")) throw Error('Calculator request headers are missing');
          if (!material.includes('mysCreatePlanItems')) throw Error('Direct calculator request is missing');
          NODE
          node --check vendor/qrcode-generator.js
          node - <<'NODE'
          const fs = require('fs');
          const m = JSON.parse(fs.readFileSync('manifest.json', 'utf8'));
          if (m.background.service_worker !== 'service-worker.js') throw Error('Unexpected service worker');
          if (!m.key || !m.host_permissions.includes('https://passport-api.mihoyo.com/*')) throw Error('Missing login configuration');
          if (!fs.readFileSync('sidepanel.html', 'utf8').includes('miyoushe-auth-ui.js')) throw Error('Missing login UI');
          if (!fs.readFileSync('service-worker.js', 'utf8').includes('miyoushe-calculator.js')) throw Error('Missing calculator worker');
          if (!fs.readFileSync('sidepanel.html', 'utf8').includes('data-calc-mode="official"')) throw Error('Missing dual-mode control');
          if (!fs.readFileSync('sidepanel.html', 'utf8').includes('id="planItems"')) throw Error('Missing cultivation item list');
          if (!fs.readFileSync('sidepanel.html', 'utf8').includes('id="miyousheOptions"')) throw Error('Missing optional Miyoushe panel');
          if (m.version !== '1.5.1') throw Error('Unexpected version');
          NODE

      - name: Build test ZIP
        run: |
          set -euo pipefail
          NAME='genshin-material-planner-accounts-v1.5.1'
          ROOT="dist/$NAME"
          mkdir -p "$ROOT/icons" "$ROOT/vendor"
          cp manifest.json background.js service-worker.js sidepanel.html app.js core.mjs hakushin.mjs hybrid-calculator.mjs multi-planner.mjs planner-accounts.mjs styles.css stepper.js stepper.css "$ROOT/"
          cp miyoushe-md5.js miyoushe-auth-network.js miyoushe-auth-state.js miyoushe-auth-ui.js miyoushe-calculator.js miyoushe-auth.css "$ROOT/"
          cp vendor/qrcode-generator.js "$ROOT/vendor/"
          cp THIRD_PARTY_NOTICES.md "$ROOT/"
          cp icons/icon16.png icons/icon32.png icons/icon48.png icons/icon128.png "$ROOT/icons/"
          cd dist
          zip -qr "$NAME.zip" "$NAME"
          sha256sum "$NAME.zip" > "$NAME.zip.sha256"

      - name: Upload test package
        uses: actions/upload-artifact@v4
        with:
          name: genshin-material-planner-accounts-v1.5.1
          path: |
            dist/genshin-material-planner-accounts-v1.5.1.zip
            dist/genshin-material-planner-accounts-v1.5.1.zip.sha256
          if-no-files-found: error
          retention-days: 14
