name: Build and publish release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, for example v1.2.11. Leave empty to use manifest.json.'
        required: false
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve and validate version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          MANIFEST_VERSION="$(jq -r '.version' manifest.json)"
          if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            TAG="${GITHUB_REF_NAME}"
          elif [[ -n "${{ inputs.tag }}" ]]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="v${MANIFEST_VERSION}"
          fi
          if [[ "${TAG}" != "v${MANIFEST_VERSION}" ]]; then
            echo "Tag ${TAG} does not match manifest version v${MANIFEST_VERSION}." >&2
            exit 1
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${MANIFEST_VERSION}" >> "$GITHUB_OUTPUT"
          echo "package=genshin-material-planner-v${MANIFEST_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Create tag for manual runs
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          if ! git rev-parse "refs/tags/${TAG}" >/dev/null 2>&1; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "${TAG}" -m "Release ${TAG}"
            git push origin "${TAG}"
          fi

      - name: Build extension archive
        shell: bash
        env:
          PACKAGE: ${{ steps.version.outputs.package }}
        run: |
          set -euo pipefail
          ROOT="dist/${PACKAGE}"
          mkdir -p "${ROOT}/icons"
          cp manifest.json background.js sidepanel.html app.js core.mjs hakushin.mjs styles.css README.md README_EN.md "${ROOT}/"
          cp icons/icon16.png icons/icon32.png icons/icon48.png icons/icon128.png "${ROOT}/icons/"
          (
            cd dist
            zip -r "${PACKAGE}.zip" "${PACKAGE}"
            sha256sum "${PACKAGE}.zip" > "${PACKAGE}.zip.sha256"
          )

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          PACKAGE: ${{ steps.version.outputs.package }}
        run: |
          set -euo pipefail
          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release upload "${TAG}" "dist/${PACKAGE}.zip" "dist/${PACKAGE}.zip.sha256" --clobber
          else
            gh release create "${TAG}" "dist/${PACKAGE}.zip" "dist/${PACKAGE}.zip.sha256" --verify-tag --title "全能养成规划面板 v${VERSION}" --generate-notes --latest
          fi
