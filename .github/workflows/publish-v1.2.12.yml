name: Publish v1.2.12

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/publish-v1.2.12.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify version and create tag
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(jq -r '.version' manifest.json)"
          if [[ "${VERSION}" != "1.2.12" ]]; then
            echo "Expected manifest version 1.2.12, got ${VERSION}." >&2
            exit 1
          fi

          git fetch --tags --force
          if git rev-parse 'refs/tags/v1.2.12' >/dev/null 2>&1; then
            echo 'Tag v1.2.12 already exists.'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git tag -a 'v1.2.12' -m 'Release v1.2.12'
            git push origin 'v1.2.12'
          fi

      - name: Remove one-time publisher
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm '.github/workflows/publish-v1.2.12.yml'
          git add -A
          git commit -m 'Remove one-time v1.2.12 publisher'
          git push origin HEAD:main
