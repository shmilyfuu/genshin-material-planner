name: Fix Miyoushe QR rendering

on:
  pull_request:
    branches:
      - main
    types:
      - reopened
      - synchronize
      - opened

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Check out test branch
        uses: actions/checkout@v4
        with:
          ref: miyoushe-import
          fetch-depth: 0

      - name: Vendor QR generator and apply UI fix
        shell: bash
        run: |
          set -euo pipefail

          TMP_DIR="$(mktemp -d)"
          (
            cd "${TMP_DIR}"
            npm pack qrcode-generator@1.4.4 >/dev/null
            tar -xzf qrcode-generator-1.4.4.tgz
          )
          mkdir -p vendor
          cp "${TMP_DIR}/package/qrcode.js" vendor/qrcode-generator.js

          cat > THIRD_PARTY_NOTICES.md <<'EOF'
          # Third-Party Notices

          ## qrcode-generator 1.4.4

          Copyright (c) 2009 Kazuhiko Arase

          Licensed under the MIT License.

          Source: https://github.com/kazuhikoarase/qrcode-generator

          The bundled source file retains its original copyright and license notice.
          EOF

          python - <<'PY'
          import json
          from pathlib import Path

          def replace_once(path, old, new):
              file = Path(path)
              text = file.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'Expected text not found in {path}: {old[:100]!r}')
              file.write_text(text.replace(old, new, 1), encoding='utf-8')

          manifest_path = Path('manifest.json')
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          manifest['version'] = '1.3.1'
          manifest['description'] = '原神角色与武器养成材料规划侧边栏实验分支，修正米游社扫码登录二维码显示，并测试国服账号数据同步。'
          manifest_path.write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          panel_path = Path('sidepanel.html')
          panel = panel_path.read_text(encoding='utf-8')
          if 'vendor/qrcode-generator.js' not in panel:
              replace_once(
                  'sidepanel.html',
                  '  <script type="module" src="app.js"></script>\n',
                  '  <script src="vendor/qrcode-generator.js"></script>\n  <script type="module" src="app.js"></script>\n'
              )

          view_path = Path('miyoushe-ui-view.js')
          view = view_path.read_text(encoding='utf-8')
          if 'const qrImage' not in view:
              replace_once(
                  'miyoushe-ui-view.js',
                  "  const qrLink = createElement('a', 'mys-qr-link', '打开扫码链接');\n  qrLink.target = '_blank';\n  qrLink.rel = 'noreferrer';\n",
                  "  const qrImage = createElement('img', 'mys-qr-image');\n  qrImage.alt = '米游社扫码登录二维码';\n"
              )
              replace_once(
                  'miyoushe-ui-view.js',
                  "    createElement('p', '', '已生成扫码登录链接。使用米游社打开后，返回这里检查扫码状态。'),\n    qrLink,\n",
                  "    createElement('p', '', '请使用手机米游社扫描下方二维码。这个地址用于生成二维码，不能直接在浏览器中打开。'),\n    qrImage,\n"
              )
              replace_once(
                  'miyoushe-ui-view.js',
                  '    card, logoutButton, qrButton, qrBox, qrLink, qrCheckButton,\n',
                  '    card, logoutButton, qrButton, qrBox, qrImage, qrCheckButton,\n'
              )

          controller_path = Path('miyoushe.js')
          controller = controller_path.read_text(encoding='utf-8')
          if 'qr.createDataURL' not in controller:
              replace_once(
                  'miyoushe.js',
                  "    qrTicket = response.qr.ticket;\n    ui.qrLink.href = response.qr.url;\n    ui.qrBox.hidden = false;\n    setStatus(ui.status, '扫码链接已生成。');\n",
                  "    qrTicket = response.qr.ticket;\n    try {\n      const qrFactory = globalThis.qrcode;\n      if (typeof qrFactory !== 'function') throw new Error('二维码组件未加载。');\n      qrFactory.stringToBytes = qrFactory.stringToBytesFuncs['UTF-8'];\n      const qr = qrFactory(0, 'M');\n      qr.addData(response.qr.url, 'Byte');\n      qr.make();\n      ui.qrImage.src = qr.createDataURL(5, 20);\n      ui.qrBox.hidden = false;\n      setStatus(ui.status, '二维码已生成，请使用手机米游社扫码。');\n    } catch (error) {\n      setStatus(ui.status, `二维码生成失败：${String(error?.message || error)}`, 'error');\n    }\n"
              )

          styles_path = Path('stepper.css')
          styles = styles_path.read_text(encoding='utf-8')
          styles = styles.replace(
              '.mys-qr-link { color: #4f46e5; font-size: 12px; overflow-wrap: anywhere; }',
              '.mys-qr-image { display: block; width: min(240px, 100%); height: auto; margin: 2px auto; border: 8px solid #fff; border-radius: 8px; image-rendering: pixelated; }'
          )
          styles_path.write_text(styles, encoding='utf-8')
          PY

          python -m json.tool manifest.json >/dev/null
          node --check miyoushe-ui-view.js
          node --check miyoushe.js
          node --check vendor/qrcode-generator.js

      - name: Commit fixed QR implementation
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/fix-miyoushe-qr.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Render Miyoushe login URL as QR code'
          git push origin HEAD:miyoushe-import
